<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>귀여운 버거 사과게임 (Apple Game)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FFF8EE;
      --bun-top: #E5A95D;
      --bun-shadow: #C98836;
      --sesame: #FFF3D4;
      --patty: #6E3B1F;
      --cheese: #FFC024;
      --lettuce: #58B656;
      --tomato: #E84A36;
      --card-bg: #FFFFFF;
      --text-dark: #4A3525;
      --text-muted: #8E7A68;
      --apple-red: #FF4757;
      --apple-stem: #5B8C32;
      --apple-leaf: #78C63E;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Jua', 'Nunito', sans-serif;
      background: radial-gradient(circle at 50% 30%, #FFFDF9 0%, #FBE9D2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dark);
      padding: 16px;
      overflow-x: hidden;
    }

    /* 전체 게임 컨테이너 */
    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 980px;
    }

    /* 햄버거 헤더 / 메뉴 바 */
    .burger-header-bar {
      background: #FFFFFF;
      border: 4px solid var(--bun-shadow);
      border-radius: 28px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 10px 0 #E3C19C, 0 16px 20px rgba(110, 59, 31, 0.15);
      margin-bottom: 16px;
      width: 100%;
      position: relative;
    }

    /* 햄버거 로고 */
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .burger-badge-icon {
      width: 52px;
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.15));
      animation: floatBadge 3s ease-in-out infinite;
    }

    @keyframes floatBadge {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
    }

    .burger-mini {
      position: relative;
      width: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .bun-t {
      width: 44px;
      height: 18px;
      background: linear-gradient(180deg, #FAD078, var(--bun-top));
      border-radius: 22px 22px 6px 6px;
      border: 2px solid var(--bun-shadow);
      position: relative;
    }
    .bun-t::after {
      content: '● ● ●';
      position: absolute;
      top: 2px;
      left: 10px;
      color: var(--sesame);
      font-size: 6px;
      letter-spacing: 2px;
    }
    .lettuce-slice {
      width: 42px;
      height: 5px;
      background: var(--lettuce);
      border-radius: 4px;
    }
    .patty-slice {
      width: 42px;
      height: 7px;
      background: var(--patty);
      border-radius: 4px;
    }
    .bun-b {
      width: 40px;
      height: 10px;
      background: var(--bun-top);
      border-radius: 4px 4px 10px 10px;
      border: 2px solid var(--bun-shadow);
    }

    .game-title {
      font-size: 26px;
      color: var(--text-dark);
      letter-spacing: 1px;
      text-shadow: 1px 1px 0 #FFF;
      line-height: 1;
    }
    .game-title span {
      color: var(--tomato);
    }

    /* 통계 영역 (점수, 타이머) */
    .stats-tray {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: bold;
      border: 3px solid;
      background: #FFF;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
    }
    .pill-score {
      border-color: #FFA502;
      color: #D35400;
    }
    .pill-timer {
      border-color: #3742FA;
      color: #2F3542;
    }
    .pill-timer.urgent {
      border-color: #FF4757;
      color: #FF4757;
      animation: pulseAlert 0.8s infinite alternate;
    }
    @keyframes pulseAlert {
      from { transform: scale(1); }
      to { transform: scale(1.08); background: #FFE8EC; }
    }

    /* 햄버거 토핑 스타일 버튼들 */
    .controls-tray {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topping-btn {
      position: relative;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 3px solid rgba(0, 0, 0, 0.15);
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
      transition: all 0.1s ease;
      color: #FFF;
      text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.3);
    }
    .topping-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.2);
    }
    .topping-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }

    /* 치즈 버튼 (일시정지) */
    .btn-cheese {
      background: linear-gradient(180deg, #FFDE59 0%, #FF9F1A 100%);
      color: #633D00;
      text-shadow: none;
      border-color: #C87504;
    }
    /* 토마토 버튼 (재시작) */
    .btn-tomato {
      background: linear-gradient(180deg, #FF6B6B 0%, #EE5253 100%);
      border-color: #B32E2E;
    }

    /* 게임 보드 메인 영역 */
    .board-container {
      position: relative;
      background: #FFFFFF;
      border: 4px solid #DFBE9B;
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 12px 0 #D1A77E, 0 20px 25px rgba(0, 0, 0, 0.08);
      cursor: crosshair;
      touch-action: none;
    }

    /* 10행 17열 그리드 */
    .apple-grid {
      display: grid;
      grid-template-columns: repeat(17, 48px);
      grid-template-rows: repeat(10, 48px);
      gap: 4px;
      background: #FFF8EE;
      border-radius: 16px;
      padding: 6px;
      position: relative;
    }

    /* 개별 사과 셀 */
    .apple-cell {
      position: relative;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease;
    }

      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
      border: 2px solid #FFFFFF;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 2px 4px rgba(0,0,0,0.8);
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* 사과 꼭지와 잎사귀 */
    .apple-body::before { display: none; 
      content: '';
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 7px;
      background: #5D4037;
      border-radius: 2px 2px 0 0;
    }
    .apple-body::after { display: none; 
      content: '';
      position: absolute;
      top: -4px;
      right: 10px;
      width: 9px;
      height: 6px;
      background: #78C63E;
      border-radius: 8px 0 8px 0;
    }

    /* 선택된 사과 하이라이트 */
    .apple-cell.selected .apple-body {
      transform: scale(1.12);
      filter: brightness(1.2) drop-shadow(0 0 7px #FFA502);
      border: 2px solid #FFD32A;
    }

    /* 클리어된 사과 */
    .apple-cell.cleared .apple-body {
      opacity: 0;
      transform: scale(0.2) rotate(45deg);
      pointer-events: none;
    }

    /* 드래그 사각형 오버레이 */
    .selection-box {
      position: absolute;
      border: 3px dashed #FF4757;
      background: rgba(255, 71, 87, 0.18);
      border-radius: 8px;
      pointer-events: none;
      z-index: 10;
      display: none;
      transition: border-color 0.1s;
    }
    .selection-box.valid {
      border: 3px solid #2ED573;
      background: rgba(46, 213, 115, 0.22);
    }

    /* 일시정지 오버레이 */
    .pause-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 245, 230, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      gap: 16px;
    }
    .pause-overlay.active {
      display: flex;
    }
    .pause-title {
      font-size: 36px;
      color: #6E3B1F;
    }
    .pause-desc {
      font-size: 18px;
      color: var(--text-muted);
    }

    /* 게임오버 / 최종 순위 화면 */
    .result-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 248, 238, 0.97);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 24px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .result-overlay.active {
      display: flex;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .result-card {
      background: #FFFFFF;
      border: 4px solid var(--bun-shadow);
      border-radius: 24px;
      padding: 24px 32px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 0 #DFBE9B, 0 18px 24px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .result-title {
      font-size: 32px;
      color: var(--patty);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .current-score-box {
      background: #FFF3D4;
      border: 3px dashed #E5A95D;
      border-radius: 16px;
      padding: 12px 28px;
      text-align: center;
      width: 100%;
    }
    .current-score-box .label {
      font-size: 15px;
      color: #8E6534;
    }
    .current-score-box .score-val {
      font-size: 40px;
      color: var(--tomato);
      font-weight: 900;
    }

    .ranking-container {
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      border-radius: 12px;
      background: #FAFAFA;
      border: 2px solid #EFEFEF;
      padding: 8px;
    }

    .ranking-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ranking-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 10px;
      background: #FFFFFF;
      font-size: 16px;
      border: 1px solid #ECECEC;
      transition: transform 0.1s;
    }
    .ranking-item.highlight {
      background: #FFF0E0;
      border: 2px solid #FF9F1A;
      font-weight: 900;
    }

    .rank-medal {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 900;
      margin-right: 8px;
      color: #FFF;
      background: #B2BEC3;
    }
    .rank-1 .rank-medal { background: #FFD32A; color: #7B5200; }
    .rank-2 .rank-medal { background: #D2D7D9; color: #2C3E50; }
    .rank-3 .rank-medal { background: #E17055; }

    /* 플로팅 파티클 효과 */
    .point-float {
      position: absolute;
      color: #FF4757;
      font-size: 26px;
      font-weight: 900;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 100;
      text-shadow: 1px 1px 0 #FFF, -1px -1px 0 #FFF, 0 0 8px rgba(255, 71, 87, 0.6);
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      30% { opacity: 1; transform: translateY(-16px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-44px) scale(1); }
    }

    /* 하단 가이드 팁 */
    .game-tip {
      margin-top: 14px;
      color: var(--text-muted);
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 모바일 반응형 스케일 */
    @media (max-width: 900px) {
      .game-wrapper {
        transform: scale(0.8);
        transform-origin: top center;
      }
    }
    @media (max-width: 720px) {
      .game-wrapper {
        transform: scale(0.62);
        transform-origin: top center;
      }
    }
    @media (max-width: 540px) {
      .game-wrapper {
        transform: scale(0.48);
        transform-origin: top center;
      }
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <!-- 상단 버거 스타일 바 -->
    <header class="burger-header-bar">
      <!-- 로고 -->
      <div class="brand-group">
        <div class="burger-badge-icon">
          <div class="burger-mini">
            <div class="bun-t"></div>
            <div class="lettuce-slice"></div>
            <div class="patty-slice"></div>
            <div class="bun-b"></div>
          </div>
        </div>
        <h1 class="game-title">버거 <span>냥이 사과게임</span></h1>
      </div>

      <!-- 점수 & 타이머 -->
      <div class="stats-tray">
        <div class="stat-pill pill-score">
          <span>🐱 점수:</span>
          <span id="scoreDisplay">0</span>
        </div>
        <div class="stat-pill pill-timer" id="timerBadge">
          <span>⏰ 시간:</span>
          <span id="timerDisplay">02:00</span>
        </div>
      </div>

      <!-- 컨트롤 버튼들 (치즈 일시정지, 토마토 재시작) -->
      <div class="controls-tray">
        <button id="pauseBtn" class="topping-btn btn-cheese" title="일시정지/계속하기">
          <span id="pauseIcon">🧀</span>
          <span id="pauseText">일시정지</span>
        </button>
        <button id="restartBtn" class="topping-btn btn-tomato" title="처음부터 다시하기">
          <span>🍅</span>
          <span>새 게임</span>
        </button>
      </div>
    </header>

    <!-- 사과 게임 판 -->
    <main class="board-container" id="boardContainer">
      <div class="apple-grid" id="appleGrid">
        <!-- 10x17 사과 셀들이 JS로 동적 생성됨 -->
      </div>
      <!-- 드래그 선택 박스 -->
      <div class="selection-box" id="selectionBox"></div>

      <!-- 일시정지 화면 -->
      <div class="pause-overlay" id="pauseOverlay">
        <div class="pause-title">🧀 잠시 쉬는 시간!</div>
        <div class="pause-desc">맛있는 버거를 생각하며 잠시 휴식 중입니다.</div>
        <button id="resumeBtn" class="topping-btn btn-cheese" style="font-size: 20px; padding: 12px 28px; margin-top: 10px;">
          <span>▶️ 게임 재개하기</span>
        </button>
      </div>

      <!-- 게임 오버 및 랭킹 모달 화면 -->
      <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
          <div class="result-title">
            <span>🍔</span>
            <span>타임 오버!</span>
          </div>

          <div class="current-score-box">
            <div class="label">이번 라운드 획득 사과</div>
            <div class="score-val" id="finalScoreVal">0</div>
          </div>

          <div style="width: 100%;">
            <div style="font-size: 16px; margin-bottom: 6px; font-weight: bold; color: var(--patty); display: flex; justify-content: space-between;">
              <span>🏆 이번 세션 랭킹 순위</span>
              <span id="totalRoundsLabel" style="font-size: 14px; color: var(--text-muted);">총 1회 플레이</span>
            </div>
            <div class="ranking-container">
              <ul class="ranking-list" id="rankingList">
                <!-- 랭킹 항목들 -->
              </ul>
            </div>
          </div>

          <button id="playAgainBtn" class="topping-btn btn-tomato" style="font-size: 20px; width: 100%; justify-content: center; padding: 14px 20px;">
            <span>🔄 다시 도전하기</span>
          </button>
        </div>
      </div>
    </main>

    <div class="game-tip">
      💡 <span>마우스로 드래그하여 상자 안 숫자의 합이 <strong>10</strong>이 되도록 사과를 모아보세요!</span>
    </div>
  </div>

  <script>
    // --- 설정 상수 ---
    const ROWS = 10;
    const COLS = 17;
    const TOTAL_SECONDS = 120; // 2분 타이머

    // --- 게임 상태 ---
    let apples = []; // 2D 배열: { row, col, val, cleared, element }
    let score = 0;
    let timeLeft = TOTAL_SECONDS;
    let timerInterval = null;
    let isPaused = false;
    let isGameOver = false;

    // 단일 세션 랭킹 기록 배열: [{ round, score, timestamp, isCurrent }]
    let sessionHistory = [];
    let roundCounter = 0;

    // 드래그 상태
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragCurrentX = 0;
    let dragCurrentY = 0;

    // DOM 요소
    const gridEl = document.getElementById('appleGrid');
    const boardContainer = document.getElementById('boardContainer');
    const selectionBox = document.getElementById('selectionBox');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerBadge = document.getElementById('timerBadge');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseText = document.getElementById('pauseText');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const resumeBtn = document.getElementById('resumeBtn');
    const restartBtn = document.getElementById('restartBtn');
    const resultOverlay = document.getElementById('resultOverlay');
    const finalScoreVal = document.getElementById('finalScoreVal');
    const rankingList = document.getElementById('rankingList');
    const totalRoundsLabel = document.getElementById('totalRoundsLabel');
    const playAgainBtn = document.getElementById('playAgainBtn');

    // 1~9 사이의 무작위 숫자 생성
    function getRandomDigit() {
      return Math.floor(Math.random() * 9) + 1;
    }

    // 그리드 초기화 및 생성
    function initGrid() {
      gridEl.innerHTML = '';
      apples = [];

      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          const val = getRandomDigit();
          const cell = document.createElement('div');
          cell.className = 'apple-cell';
          cell.dataset.row = r;
          cell.dataset.col = c;

          const body = document.createElement('div');
          body.className = 'apple-body';
          body.textContent = val;
          cell.appendChild(body);

          gridEl.appendChild(cell);

          row.push({
            row: r,
            col: c,
            val: val,
            cleared: false,
            element: cell
          });
        }
        apples.push(row);
      }
    }

    // 게임 시작 / 리셋
    function startNewGame() {
      clearInterval(timerInterval);
      score = 0;
      timeLeft = TOTAL_SECONDS;
      isPaused = false;
      isGameOver = false;

      updateScoreDisplay();
      updateTimerDisplay();
      timerBadge.classList.remove('urgent');

      pauseText.textContent = '일시정지';
      pauseOverlay.classList.remove('active');
      resultOverlay.classList.remove('active');

      initGrid();
      startTimer();
    }

    // 점수 업데이트
    function updateScoreDisplay() {
      scoreDisplay.textContent = score;
    }

    // 타이머 디스플레이 포맷
    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      if (timeLeft <= 15 && timeLeft > 0) {
        timerBadge.classList.add('urgent');
      } else {
        timerBadge.classList.remove('urgent');
      }
    }

    // 타이머 가동
    function startTimer() {
      timerInterval = setInterval(() => {
        if (!isPaused && !isGameOver) {
          timeLeft--;
          updateTimerDisplay();

          if (timeLeft <= 0) {
            handleGameOver();
          }
        }
      }, 1000);
    }

    // 일시 정지 토글
    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;

      if (isPaused) {
        pauseText.textContent = '계속하기';
        pauseOverlay.classList.add('active');
        clearSelection();
      } else {
        pauseText.textContent = '일시정지';
        pauseOverlay.classList.remove('active');
      }
    }

    // 게임 종료 및 랭킹 산출
    function handleGameOver() {
      isGameOver = true;
      clearInterval(timerInterval);
      clearSelection();

      roundCounter++;

      // 단일 세션 랭킹에 이번 결과 추가
      sessionHistory.push({
        round: roundCounter,
        score: score,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      });

      // 랭킹 리스트 렌더링
      renderRanking();

      finalScoreVal.textContent = score;
      resultOverlay.classList.add('active');
    }

    // 랭킹 렌더링
    function renderRanking() {
      // 점수 내림차순 정렬
      const sorted = [...sessionHistory].sort((a, b) => b.score - a.score);
      rankingList.innerHTML = '';

      totalRoundsLabel.textContent = `총 ${sessionHistory.length}회 플레이`;

      sorted.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `ranking-item rank-${index + 1}`;
        if (item.round === roundCounter) {
          li.classList.add('highlight');
        }

        const isCurrentTag = item.round === roundCounter ? ' <span style="color:#E84A36; font-size:12px;">(이번 플레이)</span>' : '';

        li.innerHTML = `
          <div style="display: flex; align-items: center;">
            <span class="rank-medal">${index + 1}</span>
            <span>#${item.round} 라운드${isCurrentTag}</span>
          </div>
          <div style="font-weight: 900; color: #2D3436;">${item.score} 개</div>
        `;
        rankingList.appendChild(li);
      });
    }

    // 마우스/터치 드래그 이벤트 처리
    function getPointerPos(e) {
      const rect = gridEl.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top,
        clientX,
        clientY
      };
    }

    function onPointerDown(e) {
      if (isPaused || isGameOver) return;
      if (e.target.closest('#pauseOverlay') || e.target.closest('#resultOverlay')) return;

      const pos = getPointerPos(e);
      isDragging = true;
      dragStartX = pos.x;
      dragStartY = pos.y;
      dragCurrentX = pos.x;
      dragCurrentY = pos.y;

      updateSelectionBox();
      updateSelectedCells();
    }

    function onPointerMove(e) {
      if (!isDragging || isPaused || isGameOver) return;
      const pos = getPointerPos(e);
      dragCurrentX = pos.x;
      dragCurrentY = pos.y;

      updateSelectionBox();
      updateSelectedCells();
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      selectionBox.style.display = 'none';

      checkAndClearSelected();
    }

    // 드래그 박스 UI 업데이트
    function updateSelectionBox() {
      const x = Math.min(dragStartX, dragCurrentX);
      const y = Math.min(dragStartY, dragCurrentY);
      const width = Math.abs(dragCurrentX - dragStartX);
      const height = Math.abs(dragCurrentY - dragStartY);

      selectionBox.style.display = 'block';
      selectionBox.style.left = `${x + gridEl.offsetLeft}px`;
      selectionBox.style.top = `${y + gridEl.offsetTop}px`;
      selectionBox.style.width = `${width}px`;
      selectionBox.style.height = `${height}px`;
    }

    // 현재 선택 영역 내의 사과 탐색 및 합 계산
    function getCellsInSelection() {
      const x1 = Math.min(dragStartX, dragCurrentX);
      const y1 = Math.min(dragStartY, dragCurrentY);
      const x2 = Math.max(dragStartX, dragCurrentX);
      const y2 = Math.max(dragStartY, dragCurrentY);

      const selected = [];
      let sum = 0;

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const apple = apples[r][c];
          if (apple.cleared) continue;

          const cellEl = apple.element;
          const cellLeft = cellEl.offsetLeft;
          const cellTop = cellEl.offsetTop;
          const cellRight = cellLeft + cellEl.offsetWidth;
          const cellBottom = cellTop + cellEl.offsetHeight;

          // 박스 겹침 여부 (AABB 교차 판정)
          const intersects = !(cellRight < x1 || cellLeft > x2 || cellBottom < y1 || cellTop > y2);

          if (intersects) {
            selected.push(apple);
            sum += apple.val;
          }
        }
      }

      return { selected, sum };
    }

    function updateSelectedCells() {
      // 모든 셀 선택 클래스 해제
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          apples[r][c].element.classList.remove('selected');
        }
      }

      const { selected, sum } = getCellsInSelection();

      selected.forEach(a => a.element.classList.add('selected'));

      if (sum === 10) {
        selectionBox.classList.add('valid');
      } else {
        selectionBox.classList.remove('valid');
      }
    }

    function clearSelection() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          apples[r][c].element.classList.remove('selected');
        }
      }
      selectionBox.style.display = 'none';
      selectionBox.classList.remove('valid');
    }

    // 합이 10인지 검사 후 클리어
    function checkAndClearSelected() {
      const { selected, sum } = getCellsInSelection();

      if (sum === 10 && selected.length > 0) {
        const count = selected.length;
        score += count;
        updateScoreDisplay();

        // 플로팅 득점 텍스트
        const firstEl = selected[0].element;
        createFloatingScore(firstEl, `+${count}`);

        selected.forEach(apple => {
          apple.cleared = true;
          apple.element.classList.remove('selected');
          apple.element.classList.add('cleared');
        });
      } else {
        clearSelection();
      }
    }

    // 득점 시 플로팅 애니메이션 효과
    function createFloatingScore(targetEl, text) {
      const rect = targetEl.getBoundingClientRect();
      const boardRect = boardContainer.getBoundingClientRect();

      const floatEl = document.createElement('div');
      floatEl.className = 'point-float';
      floatEl.textContent = text;
      floatEl.style.left = `${rect.left - boardRect.left + 10}px`;
      floatEl.style.top = `${rect.top - boardRect.top}px`;

      boardContainer.appendChild(floatEl);

      setTimeout(() => {
        if (floatEl.parentNode) {
          floatEl.parentNode.removeChild(floatEl);
        }
      }, 800);
    }

    // 이벤트 리스너 등록
    gridEl.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    gridEl.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    pauseBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', () => {
      if (confirm('게임을 새로 시작하시겠습니까?')) {
        startNewGame();
      }
    });
    playAgainBtn.addEventListener('click', startNewGame);

    // 최초 로드 시 게임 시작
    startNewGame();
  </script>
</body>
</html>
